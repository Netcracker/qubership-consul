apiVersion: netcracker.com/v1alpha1
kind: ConsulKV
metadata:
  name: example-consulkv
  namespace: opensearch-service
spec:
  kv:
    entries:
      - key: "config/opensearch/example-app"
      - key: "config/opensearch/example-app/LOG_LEVEL_1"
        value: "INFO"


apiVersion: netcracker.com/v1alpha1
kind: ConsulKV
metadata:
  name: example-consulkv
  namespace: opensearch-service
spec:
  kv:
    entries:
      - key: "config/opensearch/example-app/opensearch/key1"
      - key: "config/opensearch/example-app/opensearch/key2"
      - key: "config/opensearch/example-app/LOG_LEVEL_1"
        value: "INFO"


apiVersion: netcracker.com/v1alpha1
kind: ConsulKV
metadata:
  name: cloud-core-sys
  namespace: opensearch-service
spec:
  globalKV: true
  kv:
    entries:
      - key: "config/opensearch-service/example-app/opensearch/key3"
        value: "INFO"
