apiVersion: netcracker.com/v1alpha1
kind: ConsulACL
metadata:
  name: test-delete-acl
spec:
  acl:
    name: test-delete-acl
    explicitName: false
    json: >
      {
        "policies": [
          {
            "Name": "delete_policy",
            "Description": "Policy to be deleted",
            "Rules": "key_prefix \"delete/\" { policy = \"read\" }"
          }
        ],
        "roles": [
          {
            "Name": "delete_role",
            "Description": "Role to be deleted",
            "policy_names": ["delete_policy"]
          }
        ],
        "bind_rules": [
          {
            "BindName": "delete_bind",
            "ServiceAccountName": "integration-sa"
          }
        ]
      }
