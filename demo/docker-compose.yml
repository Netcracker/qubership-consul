version: '2.2'
services:
  consul:
    image: hashicorp/consul:1.6.2
    ports:
      - 8500:8500
  consul-backup-daemon:
    image: ghcr.io/netcracker/qubership-consul-backup-daemon:latest@sha256:e84f310250eb46b5f6e0cb69d8929f12651dce4371afe44fb7fad9706badd2d5
    ports:
      - 8080:8080
    links:
      - consul
    environment:
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - BACKUP_SCHEDULE=0 * * * *
      - EVICTION_POLICY=1h/1h
      - CONSUL_BACKUP_DAEMON_DEBUG=DEBUG
      - LOG_LEVEL=DEBUG