name: Sync Troubleshooting Skill
run-name: "Sync troubleshooting skill #${{ github.run_number }} — triggered by ${{ github.actor }} (${{ github.event_name }})"

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      auto-merge:
        description: "Automatically enable auto-merge for the created pull request"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync troubleshooting doc into skill
        uses: netcracker/qubership-workflow-hub/actions/sync-files-action@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          files: |
            [
              { "from": "docs/public/troubleshooting.md", "to": "agent-packages/troubleshoot-consul/.apm/skills/troubleshoot-consul/references/troubleshooting.md" },
              { "from": "docs/public/troubleshooting-scenarios/cpu_overload.md", "to": "agent-packages/troubleshoot-consul/.apm/skills/troubleshoot-consul/references/cpu_overload.md" },
              { "from": "docs/public/troubleshooting-scenarios/memory_limit.md", "to": "agent-packages/troubleshoot-consul/.apm/skills/troubleshoot-consul/references/memory_limit.md" },
              { "from": "docs/public/troubleshooting-scenarios/disk_filled_on_all_nodes.md", "to": "agent-packages/troubleshoot-consul/.apm/skills/troubleshoot-consul/references/disk_filled_on_all_nodes.md" }
            ]
          title: "chore: sync troubleshooting skill reference"
          commit-message: "chore: sync troubleshooting skill reference"
          auto-merge: ${{ inputs.auto-merge || 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}
