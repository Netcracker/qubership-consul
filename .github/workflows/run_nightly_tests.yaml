name: Run Nightly Consul Pipeline

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  Nightly-Consul-Pipeline:
    uses: Netcracker/qubership-test-pipelines/.github/workflows/consul.yaml@747df4a75b81fd05ed818a8cde6fc8198b2989c0 # v1.19.0
    with:
      service_branch: 'main'
      pipeline_branch: '747df4a75b81fd05ed818a8cde6fc8198b2989c0' # v1.19.0 renovate: depName=Netcracker/qubership-test-pipelines
      scope: 'nightly'
      allure: true
      verify_timeout_minutes: 30
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{secrets.AWS_S3_ACCESS_KEY_ID}}
      AWS_S3_ACCESS_KEY_SECRET: ${{secrets.AWS_S3_ACCESS_KEY_SECRET}}
