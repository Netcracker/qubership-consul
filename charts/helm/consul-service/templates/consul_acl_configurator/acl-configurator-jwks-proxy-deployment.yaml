{{- if .Values.consulAclConfigurator.enabled }}
{{- $proxy := .Values.consulAclConfigurator.jwksProxy | default dict }}
{{- $proxyName := printf "%s-jwks-proxy" (include "consul-acl-configurator.name" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $proxyName }}
  namespace: {{ .Release.Namespace }}
  labels:
    name: {{ $proxyName }}
    {{- include "consul-service.defaultLabels" . | nindent 4 }}
spec:
  replicas: {{ $proxy.replicas | default 2 }}
  selector:
    matchLabels:
      name: {{ $proxyName }}
  template:
    metadata:
      labels:
        {{- with .Values.global.extraLabels }}
          {{- toYaml . | nindent 8 -}}
        {{- end }}
        {{- with $proxy.extraLabels }}
          {{- toYaml . | nindent 8 -}}
        {{- end }}
        name: {{ $proxyName }}
        {{- include "consul-service.defaultLabels" . | nindent 8 }}
      annotations:
        'consul.hashicorp.com/connect-inject': 'false'
    spec:
      serviceAccountName: {{ $proxyName }}
      affinity:
      {{- if $proxy.affinity }}
        {{- tpl ($proxy.affinity | toYaml) . | nindent 8 }}
      {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    name: {{ $proxyName }}
      {{- end }}
      {{- with $proxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $proxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $proxy.priorityClassName }}
      priorityClassName: {{ $proxy.priorityClassName | quote }}
      {{- end }}
      {{- if not (eq (include "openshift.enabled" .) "true") }}
      securityContext:
        {{- include "consul.globalPodSecurityContext" . | nindent 8 }}
      {{- end }}
      containers:
        - name: kubectl-proxy
          image: {{ template "deployment-status-provisioner.image" . }}
          imagePullPolicy: Always
          command: ["kubectl"]
          args:
            - proxy
            - --address=0.0.0.0
            - --port=8080
            - --accept-hosts=.*
            - --accept-paths=^(?:/openid/v1/jwks|/\.well-known/openid-configuration)$
            - --reject-methods=^(POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE)$
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- include "consul.globalContainerSecurityContext" . | nindent 12 }}
            runAsNonRoot: true
          resources:
            requests:
              cpu: {{ dig "resources" "requests" "cpu" "20m" $proxy | quote }}
              memory: {{ dig "resources" "requests" "memory" "32Mi" $proxy | quote }}
            limits:
              cpu: {{ dig "resources" "limits" "cpu" "50m" $proxy | quote }}
              memory: {{ dig "resources" "limits" "memory" "64Mi" $proxy | quote }}
          startupProbe:
            httpGet:
              path: /openid/v1/jwks
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /openid/v1/jwks
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /openid/v1/jwks
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
{{- end }}
