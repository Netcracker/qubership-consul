{{- if (default dict .Values.idpProxy).enabled }}
{{- if not .Values.idpProxy.cookieSecret.existingSecret }}
{{- $name := printf "%s-idp-proxy-cookie" (include "consul.fullname" .) }}
{{- /* The key encrypts the cookies of all replicas. Keep the generated value on upgrades, otherwise all users are logged out. */}}
{{- $key := .Values.idpProxy.cookieSecret.value }}
{{- if not $key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (index $existing.data "cookie-secret") }}
{{- $key = index $existing.data "cookie-secret" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "consul.name" . }}
    release: {{ .Release.Name }}
    component: idp-proxy
    {{- include "consul-service.defaultLabels" . | nindent 4 }}
type: Opaque
data:
  cookie-secret: {{ $key | b64enc | quote }}
{{- end }}
{{- end }}
