{{- if and .Values.consulAclConfigurator.enabled (ne (.Values.DISABLE_CRD | toString) "true") (ne (include "consul.restrictedEnvironment" .) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "consul.fullname" . }}-crd-init-{{ .Release.Namespace }}
  labels:
    {{- include "consul-service.defaultLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
    "helm.sh/hook-weight": "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "consul.fullname" . }}-crd-init-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ template "consul.fullname" . }}-crd-init
    namespace: {{ .Release.Namespace }}
{{- end }}
