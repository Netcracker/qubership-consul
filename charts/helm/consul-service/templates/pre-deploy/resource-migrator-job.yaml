{{- if .Values.resourceMigration.enabled }}
{{- $desiredAnnotations := .Values.pvc.metadata.annotations | default (dict) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "consul.fullname" . }}-resource-migrator
  labels:
    {{- include "consul-service.defaultLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ template "consul.fullname" . }}-resource-migrator
      labels:
        app: {{ template "consul.name" . }}
        chart: {{ template "consul.chart" . }}
        release: {{ .Release.Name }}
        component: resource-migrator
        {{- include "consul-service.defaultLabels" . | nindent 8 }}
    spec:
      {{- if not (eq (include "openshift.enabled" .) "true") }}
      securityContext:
        {{- include "consul.globalPodSecurityContext" . | nindent 8 }}
        {{- with .Values.resourceMigration.securityContext }}
        {{- toYaml . | nindent 8 -}}
        {{- end }}
      {{- end }}
      restartPolicy: Never
      serviceAccountName: {{ template "consul.fullname" . }}-resource-migrator
      containers:
        - name: resource-migrator
          image: {{ .Values.podScheduler.dockerImage }}
          command:
            - "/bin/bash"
            - "-c"
            - |
              set -euo pipefail
              command -v jq >/dev/null 2>&1 || { echo "[resource-migrator] jq is required"; exit 1; }

              NAMESPACE="{{ .Release.Namespace }}"
              FULLNAME="{{ template "consul.fullname" . }}"
              SERVER_STS_NAME="${FULLNAME}-server"
              DESIRED_ANNOTATIONS='{{ $desiredAnnotations | toJson }}'

              # The CURRENT annotations are read from the StatefulSet's volumeClaimTemplates, which
              # contain only the annotations set by this chart. A live PVC also carries annotations
              # added automatically by Kubernetes, which must not be treated as stale.
              STS_JSON="$(kubectl -n "$NAMESPACE" get statefulset "$SERVER_STS_NAME" -o json 2>/dev/null || true)"
              if [ -z "$STS_JSON" ]; then
                echo "[resource-migrator] StatefulSet $SERVER_STS_NAME not found; nothing to reconcile"
                echo "[resource-migrator] done"
                exit 0
              fi

              HAS_VCT="$(printf '%s' "$STS_JSON" | jq -r '(.spec.volumeClaimTemplates // []) | length')"
              if [ "$HAS_VCT" -eq 0 ]; then
                echo "[resource-migrator] StatefulSet $SERVER_STS_NAME has no volumeClaimTemplates; nothing to reconcile"
                echo "[resource-migrator] done"
                exit 0
              fi

              ACTUAL_ANNOTATIONS="$(printf '%s' "$STS_JSON" | jq -cS '.spec.volumeClaimTemplates[0].metadata.annotations // {}')"
              DESIRED_ANNOTATIONS="$(printf '%s' "$DESIRED_ANNOTATIONS" | jq -cS 'with_entries(.value |= tostring)')"

              if [ "$ACTUAL_ANNOTATIONS" = "$DESIRED_ANNOTATIONS" ]; then
                echo "[resource-migrator] Server PVC annotations already up to date"
                echo "[resource-migrator] done"
                exit 0
              fi

              echo "[resource-migrator] Server PVC annotations changed (actual=$ACTUAL_ANNOTATIONS desired=$DESIRED_ANNOTATIONS)"

              # Desired annotations, plus null for keys previously set by the chart but no longer desired.
              PATCH=$(jq -cn --argjson desired "$DESIRED_ANNOTATIONS" --argjson old "$ACTUAL_ANNOTATIONS" '
                def stale: ($old | keys) - ($desired | keys);
                reduce stale[] as $key ($desired; .[$key] = null)
                | { metadata: { annotations: . } }
              ')

              # Server PVC names are deterministic in this chart: data-<namespace>-<fullname>-server-<ordinal>.
              for PVC in $(kubectl get pvc -n "$NAMESPACE" -o name 2>/dev/null \
                  | grep "^persistentvolumeclaim/data-${NAMESPACE}-${FULLNAME}-server-" \
                  | sed 's|persistentvolumeclaim/||'); do
                echo "[resource-migrator] Patching PVC $PVC"
                kubectl patch pvc "$PVC" -n "$NAMESPACE" --type=merge -p "$PATCH"
              done

              # volumeClaimTemplates are immutable, so the upgrade would fail on the changed annotations.
              # Delete the StatefulSet keeping its pods and PVCs; Helm recreates it during the upgrade.
              echo "[resource-migrator] Deleting StatefulSet $SERVER_STS_NAME with --cascade=orphan"
              kubectl delete statefulset "$SERVER_STS_NAME" -n "$NAMESPACE" --cascade=orphan --wait=true

              echo "[resource-migrator] done"
          resources:
            requests:
              cpu: {{ default "75m" .Values.resourceMigration.resources.requests.cpu }}
              memory: {{ default "75Mi" .Values.resourceMigration.resources.requests.memory }}
            limits:
              cpu: {{ default "150m" .Values.resourceMigration.resources.limits.cpu }}
              memory: {{ default "150Mi" .Values.resourceMigration.resources.limits.memory }}
          securityContext:
            {{- include "consul.globalContainerSecurityContext" . | nindent 12 }}
{{- end }}
