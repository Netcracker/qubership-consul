# TEMPORARY: test CRs for the ArgoCD health checks. Do not commit.
---
# Expected in ArgoCD: Healthy (status.generalStatus: synced, Successful=True)
apiVersion: netcracker.com/v1alpha1
kind: ConsulKV
metadata:
  name: argo-test-kv-healthy
  namespace: {{ .Release.Namespace }}
spec:
  kv:
    operatorNamespace: {{ .Release.Namespace }}
    purgeOnDelete: true
    entries:
      - key: "config/argo-test/healthy/key1"
        value: "value1"
      - key: "config/argo-test/healthy/key2"
        value: "value2"
---
# Expected in ArgoCD: Degraded (the entry with an empty key is skipped and recorded as an error,
# generalStatus: degraded). The valid key is still written to Consul.
apiVersion: netcracker.com/v1alpha1
kind: ConsulKV
metadata:
  name: argo-test-kv-degraded
  namespace: {{ .Release.Namespace }}
spec:
  kv:
    operatorNamespace: {{ .Release.Namespace }}
    purgeOnDelete: true
    entries:
      - key: "config/argo-test/degraded/key1"
        value: "value1"
      - key: ""
        value: "no key"
---
# Expected in ArgoCD: Healthy (policiesStatus/rolesStatus/bindRulesStatus without errors, Successful=True)
apiVersion: netcracker.com/v1alpha1
kind: ConsulACL
metadata:
  name: argo-test-acl-healthy
  namespace: {{ .Release.Namespace }}
spec:
  acl:
    name: argo-test-acl-healthy
    explicitName: true
    operatorNamespace: {{ .Release.Namespace }}
    json: >
      {
        "policies": [
          {
            "Name": "argo_test_healthy_policy",
            "Description": "Argo health check test policy",
            "Rules": "key_prefix \"config/argo-test/\" { policy = \"read\" }"
          }
        ],
        "roles": [
          {
            "Name": "argo_test_healthy_role",
            "Description": "Argo health check test role",
            "policy_names": ["argo_test_healthy_policy"]
          }
        ]
      }
---
# Expected in ArgoCD: Degraded (the policy rules are not valid HCL, Consul rejects the policy with 400,
# the error is recorded as "<policy>: error: ..." in policiesStatus)
apiVersion: netcracker.com/v1alpha1
kind: ConsulACL
metadata:
  name: argo-test-acl-degraded
  namespace: {{ .Release.Namespace }}
spec:
  acl:
    name: argo-test-acl-degraded
    explicitName: true
    operatorNamespace: {{ .Release.Namespace }}
    json: >
      {
        "policies": [
          {
            "Name": "argo_test_degraded_policy",
            "Description": "Argo health check test policy with invalid rules",
            "Rules": "key_prefix { policy = "
          }
        ]
      }
